<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Snark favicon: deadpan chat bubble -->
  <rect x="4" y="6" width="56" height="42" rx="12" fill="#18181B" stroke="#A3E635" stroke-width="4"/>
  <path d="M18 48 L18 60 L32 48 Z" fill="#18181B" stroke="#A3E635" stroke-width="4" stroke-linejoin="round"/>
  <!-- tilted, unimpressed eyes -->
  <rect x="17" y="22" width="12" height="4" rx="2" fill="#A3E635" transform="rotate(-8 23 24)"/>
  <rect x="35" y="22" width="12" height="4" rx="2" fill="#A3E635" transform="rotate(8 41 24)"/>
  <!-- perfectly flat mouth -->
  <rect x="24" y="34" width="16" height="4" rx="2" fill="#F43F5E"/>
</svg>
